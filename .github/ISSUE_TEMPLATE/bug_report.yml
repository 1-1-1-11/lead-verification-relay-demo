name: 缺陷
description: 演示服务的行为与文档不一致
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        请只使用虚构数据。不要粘贴真实客户、邮箱、电话、表格 ID、令牌或本机绝对路径。
  - type: textarea
    id: summary
    attributes:
      label: 发生了什么
      description: 实际结果，以及你期望的结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. python -m relay_demo
        2. POST /api/batches/claim
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 来自 /healthz 的 version，或 git 提交号。
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关输出
      description: 可粘贴脱敏后的 HTTP 状态、健康检查或测试失败。去掉正文、URL 和指纹。
      render: text
