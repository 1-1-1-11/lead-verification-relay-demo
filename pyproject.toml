[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-verification-relay-demo"
version = "0.1.0"
description = "Local demo of a lead-verification relay: claim a batch, check identity, then write back or pause."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Junyi Xu" }]
keywords = ["fastapi", "demo", "lead-verification"]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/1-1-1-11/lead-verification-relay-demo"
Changelog = "https://github.com/1-1-1-11/lead-verification-relay-demo/blob/main/CHANGELOG.md"
Security = "https://github.com/1-1-1-11/lead-verification-relay-demo/security"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["relay_demo"]
